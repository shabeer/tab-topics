<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Tab Topics</h1>
    <a href="#" id="open-manager">Manager ↗</a>
  </header>

  <section class="card">
    <div class="tab-line"><span id="cur-title">…</span></div>
    <div class="row">
      <select id="topic-select"></select>
      <button id="new-topic-btn" class="secondary-btn" title="Create new topic">+ New</button>
      <button id="add-btn" class="primary">Add</button>
    </div>
    <label class="chk"><input type="checkbox" id="close-after"> Close tab after adding</label>
    <div id="save-status" class="status"></div>
  </section>

  <section class="card">
    <div class="card-header-row">
      <button id="bulk-toggle" class="linkish">File all tabs in this window…</button>
      <button id="bulk-new-topic-btn" class="linkish" title="Create new topic">+ New topic</button>
    </div>
    <div id="bulk-area" hidden>
      <div id="bulk-list"></div>
      <label class="chk"><input type="checkbox" id="bulk-skip-all"> Skip all tabs</label>
      <label class="chk" title="Order in which filed entries are inserted into their queues, relative to the tab strip. Unchecked (default) files left-to-right; checked files right-to-left, so the rightmost tab lands at the top of its queue.">
        <input type="checkbox" id="bulk-rtl"> Insert in right-to-left tab order</label>
      <label class="chk"><input type="checkbox" id="bulk-close-after"> Close tabs after filing</label>
      <div class="row">
        <button id="bulk-apply" class="primary">File tabs</button>
        <button id="bulk-close" hidden>Close filed tabs</button>
      </div>
    </div>
  </section>

  <section class="card">
    <input id="search" type="search" placeholder="Search notes, titles, URLs, topics…">
    <div id="results"></div>
  </section>

  <section class="card">
    <h2>Recently saved</h2>
    <div id="recent"></div>
  </section>

  <footer>
    <span class="muted">⌥⇧U quick save · ⌥⇧N note · ⇧⌘Space popup</span>
    <div class="footer-links">
      <a href="https://github.com/shabeer/tab-topics" target="_blank" rel="noopener" id="github-link">GitHub ↗</a>
      ·
      <a href="#" id="shortcuts-link">Shortcuts</a>
    </div>
  </footer>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h3 id="dlg-title">New topic</h3>
      <label id="dlg-label" for="dlg-input">Topic name</label>
      <input id="dlg-input" type="text" autocomplete="off" placeholder="e.g. Work, Research…">
      <div class="dlg-row">
        <button value="ok" class="primary">Create</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="popup.js"></script>
</body>
</html>
