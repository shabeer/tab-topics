<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Save tab to topic</title>
  <link rel="stylesheet" href="quick.css">
</head>
<body>
  <header>
    <div id="tab-title">…</div>
    <div id="tab-host"></div>
  </header>

  <input id="filter" type="text" placeholder="Filter topics — ↑↓ + Enter, 1-9, Esc" autofocus>

  <ul id="list"></ul>

  <footer>
    <label class="chk"><input type="checkbox" id="close-after"> Close tab after adding</label>
  </footer>

  <script type="module" src="picker.js"></script>
</body>
</html>
